# Base local exclusiva para Prácticas III
spring.datasource.url=jdbc:mysql://localhost:3306/turismo_sustentable?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Entorno descartable: recrear tablas al iniciar y eliminarlas al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# No ejecutar automáticamente schema.sql ni data.sql
spring.sql.init.mode=never

# Antigüedad máxima de la cotización cuando el proveedor informa fecha
cotizacion.max-antiguedad-dias=7

# Máximo de bicicletas por contratación
alquiler.max-bicicletas-por-contratacion=10
