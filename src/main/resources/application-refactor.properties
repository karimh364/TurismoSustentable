# Base local exclusiva para Prácticas III
spring.datasource.url=jdbc:mariadb://localhost:3306/turismo_sustentable?sslMode=disable
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDB103Dialect

# Conservar los datos y comprobar la estructura existente
spring.jpa.hibernate.ddl-auto=validate

# No ejecutar automáticamente schema.sql ni data.sql
spring.sql.init.mode=never

# Antigüedad máxima de la cotización cuando el proveedor informa fecha
cotizacion.max-antiguedad-dias=7

# Máximo de bicicletas por contratación
alquiler.max-bicicletas-por-contratacion=10

# Pagos simulados: exclusivamente dinero ficticio para pruebas.
pagos.simulados.saldo-inicial-ars=1000000.00

# Perfiles por nickname. Estas propiedades NO crean usuarios.
pagos.simulados.cuentas.qa.listados.saldo-inicial-ars=1000000.00
pagos.simulados.cuentas.qa.otro.saldo-inicial-ars=0.00
pagos.simulados.cuentas.qa.poco.saldo-inicial-ars=1000.00

pagos.simulados.cuentas.qa.pendiente.resultado=PENDIENTE
pagos.simulados.cuentas.qa.pendiente.demora-segundos=20

pagos.simulados.cuentas.qa.cancelado.resultado=CANCELADO

# No cambiar los saldos iniciales como mecanismo de recarga
# mientras se conserven movimientos de esas cuentas.
