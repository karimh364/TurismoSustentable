<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - Turismo Sustentable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fas fa-bicycle text-success"></i>
            <span class="d-none d-sm-inline">
                Turismo Sustentable
            </span>
        </a>

        <a href="index.html#login-anchor"
           class="btn btn-outline-success btn-sm rounded-pill px-4">
            Volver al ingreso
        </a>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-success mb-3"></i>

                        <h2 class="fw-bold">
                            Recuperar contraseña
                        </h2>

                        <p class="text-muted">
                            Ingresá el correo asociado a tu cuenta.
                        </p>
                    </div>

                    <form id="recuperacion-form" novalidate>

                        <div class="form-floating mb-3">
                            <input type="email"
                                   class="form-control"
                                   id="recuperacion-email"
                                   maxlength="254"
                                   autocomplete="email"
                                   placeholder="Correo electrónico"
                                   required>

                            <label for="recuperacion-email">
                                Correo electrónico
                            </label>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100 py-3 fw-bold rounded-pill">
                            Enviar instrucciones
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="index.html#login-anchor"
                           class="text-success fw-bold text-decoration-none">
                            Volver a iniciar sesión
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0">
            &copy; 2026 Turismo Sustentable Río Grande.
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.getElementById('recuperacion-form')
        .addEventListener('submit', async function (event) {

            event.preventDefault();

            const email = document
                .getElementById('recuperacion-email')
                .value
                .trim();

            const formatoEmail =
                /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

            if (!email) {
                Swal.fire(
                    'Correo obligatorio',
                    'El email no puede estar vacío.',
                    'warning'
                );
                return;
            }

            if (email.length > 254) {
                Swal.fire(
                    'Correo demasiado largo',
                    'El email no puede superar los 254 caracteres.',
                    'warning'
                );
                return;
            }

            if (!formatoEmail.test(email)) {
                Swal.fire(
                    'Correo inválido',
                    'Ingresá una dirección de correo válida.',
                    'warning'
                );
                return;
            }

            try {
                const respuesta = await axios.post(
                    '/api/password/solicitar',
                    { email: email }
                );

                Swal.fire(
                    'Solicitud recibida',
                    respuesta.data,
                    'success'
                );

                document
                    .getElementById('recuperacion-form')
                    .reset();

            } catch (error) {
                let mensaje =
                    'No se pudo procesar la solicitud. Intentá nuevamente.';

                const datos = error.response?.data;
                if (error.response?.status === 400) {
                    if (Array.isArray(datos?.validationErrors)) {
                        const mensajes = datos.validationErrors
                            .filter(valor => typeof valor === 'string')
                            .map(valor => valor.replace(/^email:\s*/, '').trim())
                            .filter(Boolean);

                        if (mensajes.length > 0) {
                            mensaje = [...new Set(mensajes)].sort().join('\n');
                        }
                    } else if (typeof datos === 'string' && datos.trim()) {
                        mensaje = datos;
                    }
                }

                Swal.fire({
                    title: 'Error',
                    text: mensaje,
                    icon: 'error'
                });
            }
        });
</script>

</body>
</html>
