<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña - Turismo Sustentable</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fas fa-bicycle text-success"></i>
            <span class="d-none d-sm-inline">
                Turismo Sustentable
            </span>
        </a>

        <a href="index.html#login-anchor"
           class="btn btn-outline-success btn-sm rounded-pill px-4">
            Volver al ingreso
        </a>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="fas fa-lock fa-3x text-success mb-3"></i>

                        <h2 class="fw-bold">
                            Crear nueva contraseña
                        </h2>

                        <p class="text-muted">
                            Ingresá y confirmá tu nueva clave.
                        </p>
                    </div>

                    <form id="restablecer-form" novalidate>

                        <div class="form-floating mb-2">
                            <input type="password"
                                   class="form-control"
                                   id="password-nueva"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   placeholder="Nueva contraseña"
                                   required>

                            <label for="password-nueva">
                                Nueva contraseña
                            </label>
                        </div>

                        <small class="form-text text-muted">
                            Entre 6 y 64 caracteres, con una minúscula, una mayúscula
                            y un signo de puntuación o símbolo (ej.: ? % _ + €), sin espacios.
                        </small>

                        <div class="form-floating mt-3 mb-4">
                            <input type="password"
                                   class="form-control"
                                   id="password-confirmacion"
                                   minlength="6"
                                   maxlength="64"
                                   autocomplete="new-password"
                                   placeholder="Confirmar contraseña"
                                   required>

                            <label for="password-confirmacion">
                                Confirmar contraseña
                            </label>
                        </div>

                        <button type="submit"
                                id="boton-restablecer"
                                class="btn btn-success w-100 py-3 fw-bold rounded-pill">
                            Cambiar contraseña
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-0">
            &copy; 2026 Turismo Sustentable Río Grande.
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const token = new URLSearchParams(
        window.location.search
    ).get('token');

    const botonRestablecer = document
        .getElementById('boton-restablecer');

    if (!token) {
        botonRestablecer.disabled = true;

        Swal.fire(
            'Enlace inválido',
            'El enlace de recuperación no contiene un token válido.',
            'error'
        );
    }

    document.getElementById('restablecer-form')
        .addEventListener('submit', async function (event) {

            event.preventDefault();

            const password = document
                .getElementById('password-nueva')
                .value;

            const confirmacion = document
                .getElementById('password-confirmacion')
                .value;

            const formatoPassword =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\p{P}\p{S}])[^\p{White_Space}]+$/u;

            if (password.length < 6
                || password.length > 64
                || !formatoPassword.test(password)) {
                Swal.fire(
                    'Clave inválida',
                    'Debe tener entre 6 y 64 caracteres, una minúscula, una mayúscula y un signo de puntuación o símbolo, sin espacios.',
                    'warning'
                );
                return;
            }

            if (new TextEncoder().encode(password).length > 72) {
                Swal.fire(
                    'Clave demasiado larga',
                    'La contraseña es demasiado larga. Probá con una más corta.',
                    'warning'
                );
                return;
            }

            if (password !== confirmacion) {
                Swal.fire(
                    'Las claves no coinciden',
                    'Escribí la misma contraseña en ambos campos.',
                    'warning'
                );
                return;
            }

            try {
                const respuesta = await axios.post(
                    '/api/password/restablecer',
                    {
                        token: token,
                        password: password
                    }
                );

                await Swal.fire(
                    'Contraseña actualizada',
                    respuesta.data,
                    'success'
                );

                window.location.href =
                    'index.html#login-anchor';

            } catch (error) {
                const mensaje =
                    error.response?.data
                    || 'No se pudo cambiar la contraseña.';

                Swal.fire(
                    'Error',
                    mensaje,
                    'error'
                );
            }
        });
</script>

</body>
</html>
