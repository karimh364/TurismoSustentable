spring.application.name=TurismoSustentable

# Puerto local 8080; Render proporciona PORT automáticamente
server.port=${PORT:8080}

# Sesión HTTP: 30 minutos sin peticiones que utilicen la sesión.
# Se explicita el valor predeterminado de Spring Boot; no es duración del alquiler.
server.servlet.session.timeout=30m

# Base de datos
# Localmente se utilizan los valores MySQL que aparecen después de los dos puntos.
# En Render se reemplazarán mediante variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/turi?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQL8Dialect}

# Correo transaccional mediante Mailjet
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:Turismo Sustentable}

# URL utilizada para recuperar contraseñas
app.base-url=${APP_BASE_URL:http://localhost:8080}
